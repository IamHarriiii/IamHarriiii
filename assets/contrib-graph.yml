name: Update contribution graph

on:
  schedule:
    - cron: "15 0 * * *"   # daily, 00:15 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVG
        env:
          # GH_PAT is optional. Add it as a repo secret if you want private contributions
          # counted (also enable "Include private contributions" in your profile settings).
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-contrib-city.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-city.svg
          git diff --staged --quiet || (git commit -m "chore: update contribution graph" && git push)
